<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Effect เหมือนต้นฉบับ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@400;700;800&display=swap');

body {
    margin: 0;
    padding: 0;
    font-family: 'Kanit', sans-serif;
    background-color: #050a18; /* สีพื้นดำเข้ม */
    color: #ffffff;
    overflow-x: hidden;
}

.heading-style {
    letter-spacing: -0.02em;
    text-transform: uppercase;
    font-weight: 800;
    font-size: 3rem;
    text-align: center;
    margin-top: 50px;
}

/* Background Effect: Scanlines + Glow */
.effect-game {
    position: relative;
    width: 100%;
    min-height: 100vh;
    background-color: #050a18;
    background-image: linear-gradient(0deg, transparent 24%, rgba(0, 217, 255, 0.05) 25%, rgba(0, 217, 255, 0.05) 26%, transparent 27%, transparent 74%, rgba(0, 217, 255, 0.05) 75%, rgba(0, 217, 255, 0.05) 76%, transparent 77%, transparent),
                      linear-gradient(90deg, transparent 24%, rgba(0, 217, 255, 0.05) 25%, rgba(0, 217, 255, 0.05) 26%, transparent 27%, transparent 74%, rgba(0, 217, 255, 0.05) 75%, rgba(0, 217, 255, 0.05) 76%, transparent 77%, transparent);
    background-size: 30px 30px;
}

/* Sparkles */
@keyframes sparkle {
    0%, 100% { opacity: 0.3; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.2); }
}
.sparkle-dot {
    position: absolute;
    width: 2px;
    height: 2px;
    background: #00d9ff;
    border-radius: 50%;
    filter: blur(1px);
    animation: sparkle 3s infinite;
}

/* Glow effect */
.animate-glow {
    animation: glow 3s ease-in-out infinite alternate;
}
@keyframes glow {
    from { box-shadow: 0 0 10px rgba(0, 217, 255, 0.15); }
    to { box-shadow: 0 0 25px rgba(0, 149, 255, 0.35); }
}

/* Grid Layer */
.bg-grid {
    background-size: 40px 40px;
    background-image: radial-gradient(circle, rgba(0, 217, 255, 0.03) 1px, transparent 1px);
}

/* Scrollbar */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: #050a18; }
::-webkit-scrollbar-thumb { background: linear-gradient(#2563eb, #06b6d4); border-radius: 10px; }

/* Button style */
a.fb-button {
    display: inline-block;
    padding: 12px 30px;
    margin: 30px auto;
    color: #00d9ff;
    border: 2px solid #00d9ff;
    text-decoration: none;
    text-transform: uppercase;
    font-weight: 700;
    border-radius: 5px;
    transition: all 0.3s ease;
}
a.fb-button:hover {
    background: #00d9ff;
    color: #050a18;
}
</style>
</head>
<body class="bg-grid">
<div class="effect-game">
    <h1 class="heading-style animate-glow">ยินดีต้อนรับ</h1>
    <a href="https://www.facebook.com" target="_blank" class="fb-button">ไป Facebook</a>
</div>

<!-- Sparkle dots (ตัวอย่าง) -->
<div class="sparkle-dot" style="top:10%; left:20%;"></div>
<div class="sparkle-dot" style="top:30%; left:50%;"></div>
<div class="sparkle-dot" style="top:70%; left:80%;"></div>

</body>
</html>
